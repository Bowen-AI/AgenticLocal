[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-loop"
version = "0.1.0"
description = "A dependency-free minimal agentic AI loop runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AgenticLocal" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.scripts]
agentic-loop = "agentic_loop.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_loop*"]

